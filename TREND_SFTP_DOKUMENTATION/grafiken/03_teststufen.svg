<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Teststufen des TREND-SFTP-Pakets</title>
  <desc id="desc">Fünf aufeinander aufbauende Teststufen von lokaler Syntaxprüfung ohne externe Wirkung bis zum kontrollierten End-to-End-Transfer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill:#f8fafc; }
      .title { font:700 34px 'Segoe UI',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font:400 17px 'Segoe UI',Arial,sans-serif; fill:#475569; }
      .head { font:700 21px 'Segoe UI',Arial,sans-serif; fill:#0f172a; }
      .body { font:400 15px 'Segoe UI',Arial,sans-serif; fill:#334155; }
      .tag { font:700 14px 'Segoe UI',Arial,sans-serif; fill:#0f172a; }
      .a { fill:#dcfce7; stroke:#16a34a; stroke-width:3; }
      .b { fill:#d1fae5; stroke:#059669; stroke-width:3; }
      .c { fill:#dbeafe; stroke:#2563eb; stroke-width:3; }
      .d { fill:#fef3c7; stroke:#d97706; stroke-width:3; }
      .e { fill:#fee2e2; stroke:#dc2626; stroke-width:3; }
      .line { fill:none; stroke:#475569; stroke-width:4; marker-end:url(#arrow); }
      .risk { font:700 15px 'Segoe UI',Arial,sans-serif; fill:#7f1d1d; }
      .safe { font:700 15px 'Segoe UI',Arial,sans-serif; fill:#14532d; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="840" rx="24"/>
  <text class="title" x="700" y="55" text-anchor="middle">TREND-SFTP – Teststufen mit steigender externer Wirkung</text>
  <text class="subtitle" x="700" y="86" text-anchor="middle">Von links nach rechts steigt der Realitätsgrad – und damit die notwendige Freigabe</text>

  <line x1="170" y1="140" x2="1230" y2="140" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <text class="safe" x="170" y="122" text-anchor="middle">keine externe Wirkung</text>
  <text class="risk" x="1230" y="122" text-anchor="middle">produktive Wirkung</text>

  <rect class="a" filter="url(#shadow)" x="55" y="205" width="240" height="320" rx="20"/>
  <text class="head" x="175" y="247" text-anchor="middle">Stufe A</text>
  <text class="tag" x="175" y="277" text-anchor="middle">SYNTAX &amp; AUSWAHL</text>
  <text class="body" x="80" y="320">• TEST_PACKAGE.ps1</text>
  <text class="body" x="80" y="350">• -ListCustomers</text>
  <text class="body" x="80" y="380">• unbekannte ID</text>
  <text class="body" x="80" y="430">SFTP: nein</text>
  <text class="body" x="80" y="458">Upload: nein</text>
  <text class="body" x="80" y="486">Risiko: minimal</text>

  <path class="line" d="M295 365 L330 365"/>
  <rect class="b" filter="url(#shadow)" x="330" y="205" width="240" height="320" rx="20"/>
  <text class="head" x="450" y="247" text-anchor="middle">Stufe B</text>
  <text class="tag" x="450" y="277" text-anchor="middle">PAGERO LOKAL</text>
  <text class="body" x="355" y="320">• gültige XML</text>
  <text class="body" x="355" y="350">• Mappingfehler</text>
  <text class="body" x="355" y="380">• XML-Strukturfehler</text>
  <text class="body" x="355" y="430">SFTP: nein</text>
  <text class="body" x="355" y="458">Upload: nein</text>
  <text class="body" x="355" y="486">Risiko: gering</text>

  <path class="line" d="M570 365 L605 365"/>
  <rect class="c" filter="url(#shadow)" x="605" y="205" width="240" height="320" rx="20"/>
  <text class="head" x="725" y="247" text-anchor="middle">Stufe C</text>
  <text class="tag" x="725" y="277" text-anchor="middle">VALIDATEONLY</text>
  <text class="body" x="630" y="320">• Konfiguration</text>
  <text class="body" x="630" y="350">• Posh-SSH-Befehle</text>
  <text class="body" x="630" y="380">• Credentials</text>
  <text class="body" x="630" y="430">SFTP: nein</text>
  <text class="body" x="630" y="458">Upload: nein</text>
  <text class="body" x="630" y="486">Risiko: gering</text>

  <path class="line" d="M845 365 L880 365"/>
  <rect class="d" filter="url(#shadow)" x="880" y="205" width="240" height="320" rx="20"/>
  <text class="head" x="1000" y="247" text-anchor="middle">Stufe D</text>
  <text class="tag" x="1000" y="277" text-anchor="middle">INTEGRATION</text>
  <text class="body" x="905" y="320">• SMB und TCP</text>
  <text class="body" x="905" y="350">• SFTP/Hostkey</text>
  <text class="body" x="905" y="380">• Remote-Pfad</text>
  <text class="body" x="905" y="430">SFTP: ja</text>
  <text class="body" x="905" y="458">Upload: optional</text>
  <text class="body" x="905" y="486">Risiko: mittel</text>

  <path class="line" d="M1120 365 L1155 365"/>
  <rect class="e" filter="url(#shadow)" x="1155" y="205" width="190" height="320" rx="20"/>
  <text class="head" x="1250" y="247" text-anchor="middle">Stufe E</text>
  <text class="tag" x="1250" y="277" text-anchor="middle">END-TO-END</text>
  <text class="body" x="1180" y="320">• Upload</text>
  <text class="body" x="1180" y="350">• Rename</text>
  <text class="body" x="1180" y="380">• Wiederholung</text>
  <text class="body" x="1180" y="430">SFTP: ja</text>
  <text class="body" x="1180" y="458">Upload: ja</text>
  <text class="body" x="1180" y="486">Risiko: hoch</text>

  <rect x="125" y="590" width="1150" height="160" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text class="head" x="700" y="630" text-anchor="middle">Freigaberegel</text>
  <text class="body" x="700" y="666" text-anchor="middle">Stufen A–C dürfen ohne Dateiübertragung durchgeführt werden.</text>
  <text class="body" x="700" y="697" text-anchor="middle">Stufe D benötigt eine kontrollierte Verbindung oder Testumgebung.</text>
  <text class="body" x="700" y="728" text-anchor="middle">Stufe E nur mit freigegebener Testdatei, abgestimmtem Ziel und dokumentiertem Ergebnis.</text>

  <text class="subtitle" x="700" y="804" text-anchor="middle">Grundsatz: Erst lokal beweisen, dann verbinden, zuletzt übertragen.</text>
</svg>
