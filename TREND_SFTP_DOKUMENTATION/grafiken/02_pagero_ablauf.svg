<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280" role="img" aria-labelledby="title desc">
  <title id="title">Pagero XML-Verarbeitung und Remote-Umbenennung</title>
  <desc id="desc">Ablauf von der XML-Datei über Readiness-Prüfung, Verkäuferauswertung, Entity-Mapping und Zielnamensbildung bis zum Upload und Remote-Rename. Fehler- und Dublettenpfade sind farblich markiert.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill:#f8fafc; }
      .title { font:700 34px 'Segoe UI',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font:400 17px 'Segoe UI',Arial,sans-serif; fill:#475569; }
      .head { font:700 19px 'Segoe UI',Arial,sans-serif; fill:#0f172a; }
      .body { font:400 15px 'Segoe UI',Arial,sans-serif; fill:#334155; }
      .small { font:400 14px 'Segoe UI',Arial,sans-serif; fill:#475569; }
      .input { fill:#e0f2fe; stroke:#0284c7; stroke-width:3; }
      .process { fill:#f3e8ff; stroke:#9333ea; stroke-width:3; }
      .decision { fill:#fef3c7; stroke:#d97706; stroke-width:3; }
      .success { fill:#dcfce7; stroke:#16a34a; stroke-width:3; }
      .skip { fill:#fff7ed; stroke:#ea580c; stroke-width:3; }
      .error { fill:#fee2e2; stroke:#dc2626; stroke-width:3; }
      .neutral { fill:#e2e8f0; stroke:#64748b; stroke-width:3; }
      .line { fill:none; stroke:#475569; stroke-width:3.5; marker-end:url(#arrow); }
      .line-ok { fill:none; stroke:#16a34a; stroke-width:3.5; marker-end:url(#arrow-green); }
      .line-error { fill:none; stroke:#dc2626; stroke-width:3.5; marker-end:url(#arrow-red); }
      .yes { font:700 14px 'Segoe UI',Arial,sans-serif; fill:#166534; }
      .no { font:700 14px 'Segoe UI',Arial,sans-serif; fill:#991b1b; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1280" rx="24"/>
  <text class="title" x="700" y="52" text-anchor="middle">PAGERO – XML-Auswertung und SFTP-Umbenennung</text>
  <text class="subtitle" x="700" y="82" text-anchor="middle">Nur aktiv für CustomerId PAGERO und ProcessingMode PAGERO_XML_RENAME</text>

  <rect class="input" filter="url(#shadow)" x="440" y="115" width="520" height="86" rx="18"/>
  <text class="head" x="700" y="150" text-anchor="middle">Lokale Quelldatei</text>
  <text class="body" x="700" y="177" text-anchor="middle">2026600172.xml · UNC-Quelle · Muster *.xml</text>

  <path class="line" d="M700 201 L700 246"/>
  <polygon class="decision" filter="url(#shadow)" points="700,245 945,320 700,395 455,320"/>
  <text class="head" x="700" y="312" text-anchor="middle">Datei bereit?</text>
  <text class="body" x="700" y="338" text-anchor="middle">mindestens 60 s alt und nicht gesperrt</text>

  <path class="line-error" d="M455 320 L275 320"/>
  <text class="no" x="385" y="307" text-anchor="middle">NEIN</text>
  <rect class="skip" x="50" y="277" width="225" height="86" rx="16"/>
  <text class="head" x="162" y="312" text-anchor="middle">Skipped +1</text>
  <text class="body" x="162" y="339" text-anchor="middle">nächster Lauf</text>

  <path class="line-ok" d="M700 395 L700 443"/>
  <text class="yes" x="726" y="425">JA</text>
  <rect class="process" filter="url(#shadow)" x="410" y="447" width="580" height="105" rx="18"/>
  <text class="head" x="700" y="481" text-anchor="middle">XML sicher laden und Verkäufer lesen</text>
  <text class="body" x="700" y="510" text-anchor="middle">.../ApplicableHeaderTradeAgreement/SellerTradeParty/Name</text>
  <text class="body" x="700" y="535" text-anchor="middle">Dometic Benelux B.V.</text>

  <path class="line" d="M700 552 L700 593"/>
  <polygon class="decision" filter="url(#shadow)" points="700,590 945,665 700,740 455,665"/>
  <text class="head" x="700" y="657" text-anchor="middle">Mapping vorhanden?</text>
  <text class="body" x="700" y="683" text-anchor="middle">SellerEntityMapping enthält Verkäufer</text>

  <path class="line-error" d="M945 665 L1115 665"/>
  <text class="no" x="1024" y="651" text-anchor="middle">NEIN</text>
  <rect class="error" x="1115" y="622" width="235" height="86" rx="16"/>
  <text class="head" x="1232" y="657" text-anchor="middle">Failed +1</text>
  <text class="body" x="1232" y="684" text-anchor="middle">Mapping-/XML-Fehler</text>

  <path class="line-ok" d="M700 740 L700 782"/>
  <text class="yes" x="728" y="766">JA</text>
  <rect class="process" filter="url(#shadow)" x="350" y="786" width="700" height="110" rx="18"/>
  <text class="head" x="700" y="821" text-anchor="middle">Zielname bilden</text>
  <text class="body" x="700" y="850" text-anchor="middle">DE13-Invoice-2026600172-&lt;LastWriteTimeUtc&gt;.xml</text>
  <text class="small" x="700" y="876" text-anchor="middle">Timestampformat yyyyMMddHHmmssfff · für unveränderte Datei stabil</text>

  <path class="line" d="M700 896 L700 938"/>
  <polygon class="decision" filter="url(#shadow)" points="700,935 945,1010 700,1085 455,1010"/>
  <text class="head" x="700" y="1002" text-anchor="middle">Endgültiges Ziel vorhanden?</text>
  <text class="body" x="700" y="1028" text-anchor="middle">Test-SFTPPath /in/DE13-Invoice-...</text>

  <path class="line-error" d="M455 1010 L275 1010"/>
  <text class="no" x="382" y="996" text-anchor="middle">JA</text>
  <rect class="skip" x="30" y="958" width="245" height="104" rx="16"/>
  <text class="head" x="152" y="994" text-anchor="middle">AlreadyExists +1</text>
  <text class="body" x="152" y="1022" text-anchor="middle">kein neuer Upload</text>
  <text class="small" x="152" y="1046" text-anchor="middle">Status bleibt OK</text>

  <path class="line-ok" d="M945 1010 L1085 1010"/>
  <text class="yes" x="1012" y="996" text-anchor="middle">NEIN</text>
  <rect class="success" filter="url(#shadow)" x="1085" y="934" width="285" height="152" rx="18"/>
  <text class="head" x="1227" y="968" text-anchor="middle">1. Upload</text>
  <text class="body" x="1227" y="994" text-anchor="middle">/in/2026600172.xml</text>
  <text class="head" x="1227" y="1028" text-anchor="middle">2. Remote-Rename</text>
  <text class="body" x="1227" y="1054" text-anchor="middle">/in/DE13-Invoice-...</text>

  <path class="line-ok" d="M1227 1086 L1227 1137 L700 1137 L700 1170"/>
  <path class="line" d="M152 1062 L152 1137 L700 1137"/>
  <rect class="neutral" filter="url(#shadow)" x="410" y="1172" width="580" height="82" rx="18"/>
  <text class="head" x="700" y="1206" text-anchor="middle">Lokale Aktion RENAME_EXT · Summary · Log · Cleanup</text>
  <text class="body" x="700" y="1233" text-anchor="middle">2026600172.xml → 2026600172.done · Session und PSDrive werden geschlossen</text>
</svg>
